<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>石川 新幹線ビュースポット</title>
<style>
  :root{
    --bg:#f4f6f9;
    --card:#ffffff;
    --text:#1a2233;
    --muted:#6b7684;
    --accent:#0f6cbd;
    --accent-soft:#e5f1fc;
    --up:#c0392b;
    --down:#1e6f4c;
    --up-soft:#fdecea;
    --down-soft:#e8f6ef;
    --border:#e3e7ee;
    --shadow: 0 2px 10px rgba(20,30,50,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161f;
      --card:#1b202c;
      --text:#eef1f6;
      --muted:#9aa4b5;
      --accent:#5ea3e8;
      --accent-soft:#1c2c3d;
      --up:#ff8378;
      --down:#6bd3a3;
      --up-soft:#3a2020;
      --down-soft:#173028;
      --border:#2a3140;
      --shadow: 0 2px 12px rgba(0,0,0,0.35);
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:90px;
  }
  header{
    padding:20px 16px 12px;
    text-align:center;
  }
  header h1{
    font-size:1.15rem;
    margin:0 0 4px;
    font-weight:700;
  }
  header p{
    margin:0;
    font-size:0.8rem;
    color:var(--muted);
  }
  .container{
    max-width:520px;
    margin:0 auto;
    padding:0 14px;
  }
  .mode-toggle{
    display:flex;
    gap:8px;
    margin:14px 0;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:5px;
    box-shadow:var(--shadow);
  }
  .mode-btn{
    flex:1;
    border:none;
    background:transparent;
    padding:11px 6px;
    border-radius:10px;
    font-size:0.88rem;
    font-weight:600;
    color:var(--muted);
    cursor:pointer;
    transition:background .15s,color .15s;
  }
  .mode-btn.active{
    background:var(--accent);
    color:#fff;
  }
  .panel{display:none;}
  .panel.active{display:block;}

  .gps-btn{
    width:100%;
    padding:14px;
    font-size:0.95rem;
    font-weight:700;
    color:#fff;
    background:var(--accent);
    border:none;
    border-radius:14px;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .gps-btn:active{opacity:0.85;}
  .gps-status{
    font-size:0.8rem;
    color:var(--muted);
    text-align:center;
    margin:10px 0 0;
    min-height:1.1em;
  }
  .gps-status.error{color:var(--up);}

  select{
    width:100%;
    padding:13px;
    font-size:0.95rem;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    appearance:none;
    -webkit-appearance:none;
  }
  .select-wrap{position:relative;}
  .select-wrap::after{
    content:"▼";
    position:absolute;
    right:16px;
    top:50%;
    transform:translateY(-50%);
    font-size:0.7rem;
    color:var(--muted);
    pointer-events:none;
  }

  #results{margin-top:16px;display:flex;flex-direction:column;gap:14px;}

  .spot-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    box-shadow:var(--shadow);
  }
  .spot-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    margin-bottom:2px;
  }
  .spot-name{
    font-size:1.02rem;
    font-weight:700;
  }
  .spot-dist{
    font-size:0.78rem;
    color:var(--accent);
    font-weight:700;
    white-space:nowrap;
  }
  .spot-desc{
    font-size:0.78rem;
    color:var(--muted);
    margin:2px 0 12px;
    line-height:1.5;
  }
  .badge{
    display:inline-block;
    font-size:0.68rem;
    font-weight:700;
    padding:2px 7px;
    border-radius:999px;
    margin-right:2px;
  }
  .badge.station{background:var(--accent-soft);color:var(--accent);}
  .est-badge{
    display:inline-block;
    font-size:0.65rem;
    font-weight:700;
    padding:1px 6px;
    border-radius:999px;
    background:var(--up-soft);
    color:var(--up);
    white-space:nowrap;
  }
  .badge.between{background:var(--accent-soft);color:var(--accent);}

  .train-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .train-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px;
    border-radius:10px;
    background:var(--bg);
  }
  .dir-badge{
    font-size:0.7rem;
    font-weight:700;
    padding:3px 7px;
    border-radius:7px;
    min-width:34px;
    text-align:center;
  }
  .dir-badge.up{color:var(--up);background:var(--up-soft);}
  .dir-badge.down{color:var(--down);background:var(--down-soft);}
  .train-time{font-weight:700;font-size:0.95rem;min-width:52px;}
  .train-type{font-size:0.82rem;color:var(--muted);flex:1;}
  .train-eta{font-size:0.75rem;color:var(--muted);white-space:nowrap;}
  .no-train{font-size:0.82rem;color:var(--muted);padding:8px 2px;}

  footer{
    position:fixed;
    left:0;right:0;bottom:0;
    background:var(--card);
    border-top:1px solid var(--border);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    font-size:0.68rem;
    color:var(--muted);
    line-height:1.5;
    text-align:center;
  }
  .placeholder{
    text-align:center;
    color:var(--muted);
    font-size:0.85rem;
    padding:30px 10px;
  }
</style>
</head>
<body>
  <header>
    <h1>🚄 石川 新幹線ビュースポット</h1>
    <p>北陸新幹線・加賀温泉〜金沢の見えるスポットと通過予定</p>
  </header>

  <div class="container">
    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-gps" type="button">📍 現在地から探す</button>
      <button class="mode-btn" id="btn-manual" type="button">🗺 場所を指定する</button>
    </div>

    <div class="panel active" id="panel-gps">
      <button class="gps-btn" id="gps-request" type="button">現在地を取得する</button>
      <div class="gps-status" id="gps-status"></div>
    </div>

    <div class="panel" id="panel-manual">
      <div class="select-wrap">
        <select id="spot-select">
          <option value="" disabled selected>スポットを選択してください</option>
        </select>
      </div>
    </div>

    <div id="results"></div>
  </div>

  <footer>
    通過時刻は号数ごとの実測停車時刻（分かる場合）を優先し、通過型の列車のみ推定計算で補っています。駅間スポットの位置（区間内の比率）は概算値です。臨時列車・遅延・ダイヤ改正には対応していません（時刻表データ:2026年9月時点）。位置情報は端末内でのみ使用し、送信しません。
  </footer>

  // false=金沢→小松/加賀温泉方向で時刻は金沢より後。
  function effectiveKomatsu(entry, isUp){
    if (entry.komatsu != null) return entry.komatsu;
    return isUp ? entry.min - THROUGH_MIN.kanazawaKomatsu : entry.min + THROUGH_MIN.kanazawaKomatsu;
  }
  function effectiveKagaonsen(entry, isUp, effKomatsu){
    if (entry.kagaonsen != null) return entry.kagaonsen;
    return isUp ? effKomatsu - THROUGH_MIN.komatsuKagaonsen : effKomatsu + THROUGH_MIN.komatsuKagaonsen;
  }

  // 駅間スポットの通過時刻 = 区間の実効両端時刻を、位置比率で線形補間したもの。
  // 実測アンカー（停車型）があればそのまま使い、無い列車（通過型）だけ
  // THROUGH_MIN による推定を使う。estimated: 補間に推定値を使ったかどうか。
  function betweenStationTime(spot, entry, isUp){
    var effKomatsu = effectiveKomatsu(entry, isUp);
    if (spot.segment === "kanazawa_komatsu"){
      return { min: entry.min + spot.ratio * (effKomatsu - entry.min), estimated: entry.komatsu == null };
    }
    var effKagaonsen = effectiveKagaonsen(entry, isUp, effKomatsu);
    return {
      min: effKomatsu + spot.ratio * (effKagaonsen - effKomatsu),
      estimated: entry.komatsu == null || entry.kagaonsen == null
    };
  }

  // 小松駅・加賀温泉駅で「通過（停車しない）」列車の推定時刻一覧を作る。
  // 駅の公式時刻表（停車列車のみ）を補う形で使う。
  function stationPassingList(direction, targetStation){
    var isUp = direction === "up";
    var entries = isUp ? TABLE.kanazawaUp.filter(function(e){ return !e.atStart; }) : TABLE.kanazawaDown;
    var out = [];
    entries.forEach(function(e){
      if (targetStation === "komatsu"){
        if (e.komatsu == null){
          out.push({ min: effectiveKomatsu(e, isUp), train: e.train, estimated: true });
        }
      } else {
        if (e.kagaonsen == null){
          var effKomatsu = effectiveKomatsu(e, isUp);
          out.push({ min: effectiveKagaonsen(e, isUp, effKomatsu), train: e.train, estimated: true });
        }
      }
    });
    return out;
  }

  function getSchedule(spot){
    if (spot.type === "station"){
      if (spot.ref === "kanazawa"){
        return { up: TABLE.kanazawaUp, down: TABLE.kanazawaDown };
      }
      var realUp = TABLE[spot.ref+"Up"].map(function(e){ return { min:e.min, train:e.train, estimated:false }; });
      var realDown = TABLE[spot.ref+"Down"].map(function(e){ return { min:e.min, train:e.train, estimated:false }; });
      var passUp = stationPassingList("up", spot.ref);
      var passDown = stationPassingList("down", spot.ref);
      return {
        up: realUp.concat(passUp).sort(function(a,b){ return a.min - b.min; }),
        down: realDown.concat(passDown).sort(function(a,b){ return a.min - b.min; })
      };
    }
    // 金沢始発（atStart）の上り列車は小松・加賀温泉方面から来ていないため除外
    var upEntries = TABLE.kanazawaUp.filter(function(e){ return !e.atStart; });
    return {
      up: upEntries.map(function(e){ var r = betweenStationTime(spot, e, true); return { min: r.min, train: e.train, estimated: r.estimated }; }),
      down: TABLE.kanazawaDown.map(function(e){ var r = betweenStationTime(spot, e, false); return { min: r.min, train: e.train, estimated: r.estimated }; })
    };
  }

  function minToStr(min){
    var m = ((min % 1440) + 1440) % 1440;
    var h = Math.floor(m/60), mi = Math.round(m%60);
    if (mi === 60){ mi = 0; h += 1; }
    return (h<10?"0"+h:h) + ":" + (mi<10?"0"+mi:mi);
  }

  function haversine(lat1, lng1, lat2, lng2){
    var R = 6371;
    var dLat = (lat2-lat1) * Math.PI/180;
    var dLng = (lng2-lng1) * Math.PI/180;
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
            Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
            Math.sin(dLng/2)*Math.sin(dLng/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function nowMinutes(){
    var d = new Date();
    return d.getHours()*60 + d.getMinutes();
  }

  function upcomingTrains(spot, count){
    var sched = getSchedule(spot);
    var now = nowMinutes();
    var combined = [];
    sched.up.forEach(function(e){ combined.push({ min:e.min, train:e.train, dir:"up", estimated:!!e.estimated }); });
    sched.down.forEach(function(e){ combined.push({ min:e.min, train:e.train, dir:"down", estimated:!!e.estimated }); });
    combined = combined.filter(function(e){ return e.min >= now; });
    combined.sort(function(a,b){ return a.min - b.min; });
    return combined.slice(0, count);
  }

  function renderTrainList(spot){
    var trains = upcomingTrains(spot, 4);
    if (trains.length === 0){
      return '<div class="no-train">本日の運行は終了しました</div>';
    }
    var now = nowMinutes();
    var html = '<ul class="train-list">';
    trains.forEach(function(t){
      var diff = Math.round(t.min - now);
      var dirLabel = t.dir === "up" ? "上り" : "下り";
      var dirDest = t.dir === "up" ? "金沢・東京方面" : "加賀温泉・敦賀方面";
      var estLabel = "";
      if (t.estimated){
        estLabel = spot.type === "station" ?
          ' <span class="est-badge">通過(推定)</span>' :
          ' <span class="est-badge">推定</span>';
      }
      html += '<li class="train-row">' +
        '<span class="dir-badge ' + t.dir + '">' + dirLabel + '</span>' +
        '<span class="train-time">' + minToStr(t.min) + '</span>' +
        '<span class="train-type">' + t.train + '（' + dirDest + '）' + estLabel + '</span>' +
        '<span class="train-eta">' + (diff <= 0 ? "まもなく" : "あと" + diff + "分") + '</span>' +
        '</li>';
    });
    html += '</ul>';
    return html;
  }

  function spotCard(spot, distanceKm){
    var badgeLabel = spot.type === "station" ? "駅" : "駅間スポット";
    var distHtml = (distanceKm !== undefined) ?
      '<span class="spot-dist">' + formatDist(distanceKm) + '</span>' : '';
    return '<div class="spot-card">' +
      '<div class="spot-head">' +
        '<span class="spot-name"><span class="badge ' + spot.type + '">' + badgeLabel + '</span> ' + spot.name + '</span>' +
        distHtml +
      '</div>' +
      '<div class="spot-desc">' + spot.desc + '</div>' +
      renderTrainList(spot) +
      '</div>';
  }

  function formatDist(km){
    if (km < 1) return Math.round(km*1000) + "m";
    return km.toFixed(1) + "km";
  }

  var resultsEl = document.getElementById("results");

  // ---------- モード切替 ----------
  var btnGps = document.getElementById("btn-gps");
  var btnManual = document.getElementById("btn-manual");
  var panelGps = document.getElementById("panel-gps");
  var panelManual = document.getElementById("panel-manual");

  function setMode(mode){
    if (mode === "gps"){
      btnGps.classList.add("active"); btnManual.classList.remove("active");
      panelGps.classList.add("active"); panelManual.classList.remove("active");
      if (lastPosition){
        renderFromGps(lastPosition);
      } else {
        resultsEl.innerHTML = '<div class="placeholder">「現在地を取得する」を押してください</div>';
      }
    } else {
      btnManual.classList.add("active"); btnGps.classList.remove("active");
      panelManual.classList.add("active"); panelGps.classList.remove("active");
      resultsEl.innerHTML = '<div class="placeholder">スポットを選択してください</div>';
    }
  }
  btnGps.addEventListener("click", function(){ setMode("gps"); });
  btnManual.addEventListener("click", function(){ setMode("manual"); });
  btnGps.addEventListener("touchend", function(e){ e.preventDefault(); setMode("gps"); });
  btnManual.addEventListener("touchend", function(e){ e.preventDefault(); setMode("manual"); });

  // ---------- GPSモード ----------
  var gpsStatus = document.getElementById("gps-status");
  var gpsBtn = document.getElementById("gps-request");
  var lastPosition = null;
  var refreshTimer = null;

  function renderFromGps(pos){
    var lat = pos.coords.latitude, lng = pos.coords.longitude;
    var withDist = SPOTS.map(function(s){
      return { spot:s, dist: haversine(lat,lng,s.lat,s.lng) };
    }).sort(function(a,b){ return a.dist - b.dist; });

    resultsEl.innerHTML = withDist.map(function(w){
      return spotCard(w.spot, w.dist);
    }).join("");
  }

  function requestGps(){
    if (!navigator.geolocation){
      gpsStatus.textContent = "この端末・ブラウザは位置情報に対応していません。";
      gpsStatus.classList.add("error");
      return;
    }
    gpsStatus.classList.remove("error");
    gpsStatus.textContent = "位置情報を取得しています…";
    navigator.geolocation.getCurrentPosition(function(pos){
      lastPosition = pos;
      gpsStatus.textContent = "取得しました（誤差 約" + Math.round(pos.coords.accuracy) + "m）";
      renderFromGps(pos);
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(function(){
        if (lastPosition) renderFromGps(lastPosition);
      }, 30000);
    }, function(err){
      var msg = "位置情報を取得できませんでした。";
      if (err.code === err.PERMISSION_DENIED) msg = "位置情報の利用が許可されていません。ブラウザの設定を確認してください。";
      else if (err.code === err.POSITION_UNAVAILABLE) msg = "現在地を特定できませんでした。";
      else if (err.code === err.TIMEOUT) msg = "位置情報の取得がタイムアウトしました。";
      gpsStatus.textContent = msg + "（file:// で開いている場合や非HTTPS環境ではブロックされることがあります）";
      gpsStatus.classList.add("error");
    }, { enableHighAccuracy:true, timeout:10000, maximumAge:30000 });
  }
  gpsBtn.addEventListener("click", requestGps);

  // ---------- 場所指定モード ----------
  var select = document.getElementById("spot-select");
  SPOTS.forEach(function(s){
    var opt = document.createElement("option");
    opt.value = s.id;
    opt.textContent = (s.type==="station" ? "【駅】" : "【駅間】") + s.name;
    select.appendChild(opt);
  });
  select.addEventListener("change", function(){
    var spot = SPOTS.filter(function(s){ return s.id === select.value; })[0];
    if (!spot) return;
    resultsEl.innerHTML = spotCard(spot);
  });

  // 初期表示
  setMode("gps");
})();
</script>
</body>
</html>
